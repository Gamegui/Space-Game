<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Космический Штурм: Ультра — динамический космический roguelite-шутер с кораблями, улучшениями и боссами." />
    <title>Космический Штурм: Ультра</title>
    <!-- Official Yandex Games SDK (relative path for Yandex hosting, per documentation).
         defer: скрипт не блокирует парсинг страницы — в dev-режиме файла нет,
         и блокирующий тег замораживал страницу на белом экране. -->
    <script src="/sdk.js" defer></script>
    <script>
      // Ранний сборщик ошибок страницы: активен только в dev-сборке с VITE_ADMIN
      // (в релизе true не определён и условие ложно). Любой краш рендера
      // уходит на dev-сервер /__perf_log — белый экран больше не слепая зона.
      if ("true" === "true") {
        window.__sendPerfErr = function (kind, message, stack) {
          try {
            var payload = encodeURIComponent(JSON.stringify({
              kind: kind,
              message: String(message).slice(0, 600),
              stack: String(stack || "").slice(0, 2500),
              href: location.href,
              ua: navigator.userAgent
            }));
            if (navigator.sendBeacon) navigator.sendBeacon("/__perf_log?d=" + payload);
            else (new Image()).src = "/__perf_log?d=" + payload;
          } catch (e) { /* канал мёртв — больше ничего не сделать */ }
        };
        window.addEventListener("error", function (e) {
          window.__sendPerfErr("PAGE_ERROR", e.message, (e.error && e.error.stack) || (e.filename + ":" + e.lineno + ":" + e.colno));
        });
        window.addEventListener("unhandledrejection", function (e) {
          window.__sendPerfErr("PAGE_REJECTION", (e.reason && e.reason.message) || String(e.reason), e.reason && e.reason.stack);
        });
        // Страховка «белого экрана»: если React не смонтировался за 6 секунд —
        // сообщаем на сервер и показываем видимый текст вместо пустоты.
        setTimeout(function () {
          if (!window.__appMounted) {
            window.__sendPerfErr("NO_MOUNT", "React не смонтировался за 6000 мс", "");
            var el = document.getElementById("boot-msg");
            if (el) el.style.display = "block";
          }
        }, 6000);
      }
    </script>
